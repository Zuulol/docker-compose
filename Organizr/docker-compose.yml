version: "3.6"
services:
    organizr:
        container_name: organizr
        hostname: organizr
        image: organizr/organizr@sha256:52183b1eeb25632e68b677adafbcbaa5436d62cbbbe049edd4fcfa527baa0b1d
        restart: unless-stopped
        ports:
            - 9292:80
        volumes:
            - /home/ruler/organzir/config:/config # try to map config folders to config folders
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=America/NewYork
