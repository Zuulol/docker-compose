version: "3.6"
services:
    organizr:
        container_name: organizr
        hostname: organizr
        image: organizr/organizr@sha256:703de7b15e3ca0046c9bcfee03c72539f74acc5e26929f2911aa1af2be8ebb01
        restart: unless-stopped
        ports:
            - 9292:80
        volumes:
            - /home/ruler/organzir/config:/config # try to map config folders to config folders
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=America/NewYork
