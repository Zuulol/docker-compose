version: "3.6"
services:
    organizr:
        container_name: organizr
        hostname: organizr
        image: organizr/organizr@sha256:a3451b1ef949c7d02fe304ec5964cc621d29e2236c0bf755c24a96d2af36a0b8
        restart: unless-stopped
        ports:
            - 9292:80
        volumes:
            - /home/ruler/organzir/config:/config # try to map config folders to config folders
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=America/NewYork
